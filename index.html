<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple website hosted on GitHub." />
  <title>Welcome</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    main {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 650px;
    }
    h1 { font-size: clamp(2.5rem, 8vw, 5rem); margin: 0 0 1rem; }
    p { font-size: 1.2rem; line-height: 1.6; opacity: 0.9; }
    button {
      margin-top: 1rem;
      padding: 0.9rem 1.5rem;
      border: 0;
      border-radius: 999px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world! 👋</h1>
    <p>This is a simple website built in the axilort-studios/testing repository.</p>
    <button id="helloButton">Click me</button>
  </main>
  <script>
    document.getElementById('helloButton').addEventListener('click', () => {
      alert('Thanks for visiting! 🎉');
    });
  </script>
</body>
</html>
